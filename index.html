<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakous SC | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#2a9d53',
                            DEFAULT: '#176332', // Updated custom green
                            dark: '#0f4422',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Subtle sport-themed pattern updated with new color */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23176332' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism effect for the main card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-brand-light selection:text-white relative overflow-x-hidden">

    <!-- Decorative background blobs -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-brand-light rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>

    <main class="w-full max-w-4xl glass-card rounded-3xl p-8 md:p-16 text-center relative z-10 flex flex-col items-center">
        
        <!-- Header Section -->
        <header class="mb-10 w-full">
            <div class="flex flex-col md:flex-row justify-center md:justify-between items-center mb-6 gap-4 md:gap-0">
                <!-- English Name -->
                <h2 class="text-xl md:text-2xl font-bold text-slate-800 tracking-wider flex-1 text-center md:text-right order-2 md:order-1">BAKOUS SPORTS CLUB</h2>
                <!-- Logo -->
                <div class="w-32 h-32 md:w-40 md:h-40 shrink-0 flex items-center justify-center order-1 md:order-2 z-10">
                    <img src="Logo.png" alt="Bakous SC Logo" class="max-w-full max-h-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/400x400/176332/ffffff?text=BSC';">
                </div>
                <!-- Arabic Name -->
                <h2 class="text-xl md:text-2xl font-bold text-slate-800 font-arabic flex-1 text-center md:text-left order-3">نادي باكوس الرياضي</h2>
            </div>
        </header>

        <!-- Main Announcement -->
        <div class="mb-12 max-w-2xl mt-4">
            <h2 class="text-lg md:text-xl font-semibold text-slate-600 mb-4 uppercase tracking-wider fade-in-up">
                A New Era of <span class="text-brand">Sports Excellence</span>
            </h2>
            <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 mb-6 leading-tight fade-in-up delay-100 uppercase tracking-tighter">
                Coming Soon
            </h1>
            <p class="text-lg md:text-xl text-slate-600 mb-2 fade-in-up delay-200">
                Stay tuned for a whole new experience in the club
            </p>
            <p class="text-lg md:text-xl text-slate-600 font-arabic fade-in-up delay-200" dir="rtl">
                استعدوا لتجربة جديدة في نادي باكوس
            </p>
        </div>

        <!-- Subscription Form -->
        <div class="w-full max-w-md mx-auto fade-in-up delay-300">
            <form id="notify-form" class="relative group">
                <div class="flex flex-col sm:flex-row-reverse gap-3">
                    <input 
                        type="email" 
                        name="email"
                        id="email-input"
                        placeholder="أدخل بريدك الإلكتروني ليصلك كل جديد" 
                        required
                        class="w-full px-5 py-4 rounded-xl border border-slate-200 focus:border-brand focus:ring-2 focus:ring-brand/20 outline-none transition-all duration-300 bg-white/50 backdrop-blur-sm shadow-sm text-slate-700 placeholder:text-slate-400 text-right font-arabic"
                        dir="rtl"
                    >
                    <button 
                        type="submit"
                        id="submit-btn"
                        class="px-8 py-4 bg-slate-900 hover:bg-brand text-white font-semibold rounded-xl transition-colors duration-300 shadow-md whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand font-arabic disabled:opacity-50"
                    >
                        أعلمني
                    </button>
                </div>
                <!-- Status Message -->
                <p id="form-message" class="text-sm mt-3 font-arabic text-center hidden"></p>
            </form>
        </div>

        <!-- Footer -->
        <footer class="mt-16 pt-8 border-t border-slate-200/60 w-full flex flex-col items-center fade-in-up delay-400">
            <p class="text-xs text-slate-400">
                &copy; <span id="year"></span> Bakous Sports Club. All rights reserved.
            </p>
        </footer>
    </main>

    <script>
        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Initialize Supabase Client
        const SUPABASE_URL = 'https://touwpydzxmjrvsppqyqr.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvdXdweWR6eG1qcnZzcHBxeXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDM0NDIsImV4cCI6MjEwMzMxOTQ0Mn0.xhNYyd6-Vr1vb_f5iGEUA1_TDsIX3sf_6hh7UjwW6ik';
        
        let supabaseClient = null;
        
        // Prevent fatal error if the credentials haven't been added yet
        if (SUPABASE_URL.startsWith('http')) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.warn('⚠️ Supabase credentials not set. Please replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY.');
        }

        // 2. Handle Form Submission
        const form = document.getElementById('notify-form');
        const emailInput = document.getElementById('email-input');
        const submitBtn = document.getElementById('submit-btn');
        const messageEl = document.getElementById('form-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent standard page reload
            
            const email = emailInput.value.trim();
            if (!email) return;

            // Set loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التسجيل...'; // "Registering..."
            messageEl.classList.add('hidden');

            // Warn the user if Supabase isn't configured
            if (!supabaseClient) {
                setTimeout(() => {
                    messageEl.textContent = 'تنبيه: لم يتم ربط قاعدة البيانات بعد. يرجى إضافة روابط Supabase في الكود.'; 
                    messageEl.className = 'text-sm mt-3 font-arabic text-center text-amber-600 font-semibold block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'أعلمني';
                }, 800);
                return;
            }

            try {
                // Insert into Supabase table named 'subscribers'
                const { error } = await supabaseClient
                    .from('subscribers') 
                    .insert([{ email: email }]);

                if (error) throw error;

                // Show success message
                messageEl.textContent = 'تم التسجيل بنجاح! شكراً لك.'; // "Registered successfully!"
                messageEl.className = 'text-sm mt-3 font-arabic text-center text-brand font-semibold block';
                emailInput.value = ''; // Clear the input

            } catch (error) {
                console.error('Error saving email:', error);
                // Show error message
                messageEl.textContent = 'حدث خطأ. يرجى المحاولة مرة أخرى.'; // "An error occurred."
                messageEl.className = 'text-sm mt-3 font-arabic text-center text-red-500 block';
            } finally {
                // Reset button state
                if (supabaseClient) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'أعلمني';
                }
            }
        });
    </script>
</body>
</html>
